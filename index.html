<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Palace Community Cup 2 | Elite Registration</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/alphabravo2k-rgb/pixel-palace-registration/1a7d90c43796fd037316bdaf4f3b4de9a485d615/image_4379f9.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createIcons } from 'https://cdn.jsdelivr.net/npm/lucide@latest/dist/esm/lucide.js';
        window.onload = createIcons;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@300..700&family=Rajdhani:wght@500;700&display=swap');
        body { font-family: 'Rajdhani', sans-serif; background-color: #050505; color: #e4e4e7; overflow-x: hidden; }
        h1, h2, h3, .brand-font { font-family: 'Teko', sans-serif; font-weight: 700; }
        .bg-cyber {
            background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(0, 0, 0, 0.98)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, #1a1a1a 2px, #1a1a1a 4px);
            background-size: cover; background-attachment: fixed; 
        }
        .hud-panel {
            background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative; clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
        }
        .hud-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: linear-gradient(to bottom, #c026d3, #7c3aed); opacity: 0.8;
        }
        .input-tech {
            background: rgba(0, 0, 0, 0.6); border: 1px solid #333; font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px; transition: all 0.3s ease;
        }
        .input-tech:focus { border-color: #d946ef; background: rgba(20, 0, 20, 0.6); outline: none; }
        .btn-skew { transform: skew(-10deg); background: linear-gradient(90deg, #9333ea, #db2777); transition: all 0.3s ease; }
        .btn-skew > span { transform: skew(10deg); display: block; }
        .btn-skew:hover:not(:disabled) { filter: brightness(1.2); box-shadow: 0 0 20px rgba(219, 39, 119, 0.6); }
        .btn-skew:disabled { background: #333; cursor: not-allowed; filter: grayscale(1); opacity: 0.7; }
    </style>
</head>
<body class="min-h-screen bg-cyber selection:bg-fuchsia-500/40">

    <div class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8 md:py-16">
        <header class="text-center mb-12 flex flex-col items-center relative">
            <img src="https://raw.githubusercontent.com/alphabravo2k-rgb/pixel-palace-registration/1a7d90c43796fd037316bdaf4f3b4de9a485d615/image_4379f9.png" alt="Pixel Palace Logo" class="w-32 h-32 object-contain mb-6 drop-shadow-[0_0_15px_rgba(192,38,211,0.5)]">
            <h1 class="text-5xl sm:text-7xl md:text-9xl font-black text-white italic tracking-tighter brand-font leading-none drop-shadow-[0_0_15px_rgba(192,38,211,0.5)]">
                PIXEL PALACE <span class="text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 via-pink-500 to-purple-600">CUP 2</span>
            </h1>
            
            <div class="w-full max-w-5xl mx-auto mt-8 p-[1px] bg-gradient-to-r from-transparent via-zinc-700 to-transparent">
                <div class="grid grid-cols-2 md:grid-cols-4 bg-black/80 backdrop-blur-md">
                    <div class="p-3 border-r border-zinc-800 text-center">
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-1">Live Slots</p>
                        <p id="slot-display" class="text-2xl text-fuchsia-400 brand-font">OPEN</p>
                    </div>
                    <div class="p-3 border-r border-zinc-800 text-center">
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-1">Prize Pool</p>
                        <p class="text-2xl text-yellow-400 brand-font">TBA</p>
                    </div>
                    <div class="p-3 border-r border-zinc-800 text-center">
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-1">Format</p>
                        <p class="text-2xl text-cyan-400 brand-font">5v5 BO5</p>
                    </div>
                    <div class="p-3 text-center">
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-1">Requirement</p>
                        <p class="text-xs font-bold text-green-400 uppercase mt-2">Discord Member</p>
                    </div>
                </div>
            </div>
            
            <div id="countdown-wrapper" class="mt-8 bg-fuchsia-900/20 border border-fuchsia-500/30 rounded p-4 text-center w-full max-w-md mx-auto">
                <p class="text-[10px] uppercase text-fuchsia-400 font-bold tracking-widest mb-1">Registration Closes In</p>
                <p id="time-left" class="text-3xl brand-font text-white">LOADING...</p>
            </div>
        </header>

        <form id="registrationForm" class="max-w-4xl mx-auto space-y-8">
            <div class="hud-panel p-6 md:p-8">
                <h2 class="text-2xl text-white brand-font uppercase tracking-wide mb-6 border-b border-white/10 pb-4">01 // Team Identity</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="col-span-full bg-fuchsia-900/10 p-4 border border-fuchsia-500/30 mb-4">
                        <label class="text-xs font-bold uppercase text-fuchsia-400 mb-2 block">VIP Access Code (Optional)</label>
                        <input type="text" id="inviteCode" placeholder="Bypass slot limits" class="input-tech w-full p-3 text-white">
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-xs font-bold uppercase text-zinc-500 mb-1 block">Team Name</label>
                        <input type="text" id="teamName" required class="input-tech w-full p-3 text-white font-bold text-lg">
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase text-zinc-500 mb-1 block">Team Tag</label>
                        <input type="text" id="teamTag" required pattern="[A-Za-z0-9]+" title="Letters and numbers only" class="input-tech w-full p-3 text-white">
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase text-zinc-500 mb-1 block">Region</label>
                        <select id="teamRegion" required class="input-tech w-full p-3 text-white">
                            <option value="">Select...</option>
                            <option value="IND">IND</option><option value="PAK">PAK</option><option value="ME">ME</option><option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-span-full">
                        <label class="text-xs font-bold uppercase text-zinc-500 mb-1 block">Team Logo Link (JPEG/PNG)</label>
                        <input type="url" id="logoLink" required placeholder="https://..." class="input-tech w-full p-3 text-white">
                    </div>
                </div>
            </div>

            <div class="hud-panel p-6 md:p-8">
                <h2 class="text-2xl text-white brand-font uppercase mb-6 border-b border-white/10 pb-4">02 // Roster Manifest</h2>
                <div id="roster-container" class="space-y-4"></div>
            </div>

            <div class="hud-panel p-6 md:p-8">
                <h2 class="text-2xl text-white brand-font uppercase mb-6 border-b border-white/10 pb-4">03 // Final Auth</h2>
                <div class="space-y-4 mb-8">
                    <label class="flex items-center gap-4 p-4 bg-white/5 border border-white/5 cursor-pointer">
                        <input type="checkbox" required class="w-5 h-5 accent-fuchsia-500">
                        <span class="text-sm text-zinc-300">We acknowledge that <strong>Akros Anti-Cheat</strong> is required.</span>
                    </label>
                    <label class="flex items-center gap-4 p-4 bg-white/5 border border-white/5 cursor-pointer">
                        <input type="checkbox" required class="w-5 h-5 accent-fuchsia-500">
                        <span class="text-sm text-zinc-300">All players have joined the <strong>Discord HQ</strong>.</span>
                    </label>
                    <label class="flex items-center gap-4 p-4 bg-white/5 border border-white/5 cursor-pointer">
                        <input type="checkbox" required class="w-5 h-5 accent-fuchsia-500">
                        <span class="text-sm text-zinc-300">We consent to the collection of player IDs for tournament bracket operations (GDPR/Privacy Compliance).</span>
                    </label>
                </div>

                <div id="errorBox" class="hidden mb-6 bg-red-900/40 border border-red-500 p-4 text-red-300 text-sm font-bold uppercase tracking-wider text-center"></div>
                
                <button type="submit" id="submitBtn" class="btn-skew w-full py-5 text-xl font-black text-white uppercase tracking-widest shadow-lg">
                    <span>INITIATE REGISTRATION</span>
                </button>
            </div>
        </form>
        
        <div id="successMessage" class="hidden mt-8 hud-panel p-8 text-center border-green-500 border">
            <h2 class="text-4xl font-bold text-green-400 mb-2 brand-font uppercase">ROSTER SECURED</h2>
            <p class="text-zinc-400">Data transmission confirmed and verified by the database.</p>
        </div>
    </div>

    <script>
        const deadlineDate = new Date('2026-03-31T23:59:59Z').getTime(); 
        const API_URL = 'https://script.google.com/macros/s/AKfycbz8hFm1acnZIAEXvFf_nw3k4THr7tzsmvDszAN-ALhtU08zMOVOaiiCHRcr4ZiiBFP3eg/exec';

        // Build Roster UI with Snowflake Regex
        const container = document.getElementById('roster-container');
        const ranks = '<option value="">Rank</option><option value="Level 1-3">Level 1-3</option><option value="Level 4-7">Level 4-7</option><option value="Level 8-9">Level 8-9</option><option value="Level 10">Level 10</option>';
        for(let i=1; i<=6; i++) {
            let title = i === 1 ? 'CAPTAIN' : (i === 6 ? 'SUBSTITUTE (OPTIONAL)' : 'STARTER');
            let req = i === 6 ? '' : 'required';
            let bColor = i === 1 ? 'border-yellow-500' : (i === 6 ? 'border-zinc-500' : 'border-indigo-500');
            container.innerHTML += `
            <div class="bg-black/30 p-4 border-l-2 ${bColor}">
                <span class="text-sm font-bold uppercase text-zinc-400 mb-3 block">Operator 0${i} // <span class="text-white">${title}</span></span>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="p${i}Discord" ${req} pattern="^\\d{17,19}$" title="Must be a 17-19 digit Discord User ID (Snowflake)" placeholder="Discord ID (17-19 Digits)" class="input-tech w-full p-2 text-sm text-white">
                    <input type="url" id="p${i}Steam" ${req} placeholder="Steam URL" class="input-tech w-full p-2 text-sm text-white">
                    <input type="url" id="p${i}Faceit" ${req} placeholder="FACEIT URL" class="input-tech w-full p-2 text-sm text-white">
                    <select id="p${i}Rank" ${req} class="input-tech w-full p-2 text-sm text-white">${ranks}</select>
                </div>
            </div>`;
        }

        // Live Slot Polling
        async function fetchSlots() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                document.getElementById('slot-display').innerHTML = data.isFull ? '<span class="text-red-500">FULL</span>' : `${data.confirmed} / 32`;
            } catch(e) {}
        }
        fetchSlots();

        // Fixed Clean Timer
        const timerInterval = setInterval(() => {
            const diff = deadlineDate - new Date().getTime();
            const tLeft = document.getElementById('time-left');
            if(diff < 0) { 
                tLeft.textContent = 'OFFLINE'; 
                tLeft.classList.add('text-red-500'); 
                document.getElementById('submitBtn').disabled = true; 
                clearInterval(timerInterval); // Memory leak patched
                return; 
            }
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            tLeft.textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);

        // Submit to API
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            btn.disabled = true;
            btn.innerHTML = '<span>TRANSMITTING...</span>';
            errorBox.classList.add('hidden');

            const payload = {
                inviteCode: document.getElementById('inviteCode').value,
                teamName: document.getElementById('teamName').value,
                teamTag: document.getElementById('teamTag').value,
                teamRegion: document.getElementById('teamRegion').value,
                logoLink: document.getElementById('logoLink').value
            };
            
            for(let i=1; i<=6; i++) {
                payload[`p${i}Discord`] = document.getElementById(`p${i}Discord`).value;
                payload[`p${i}Steam`] = document.getElementById(`p${i}Steam`).value;
                payload[`p${i}Faceit`] = document.getElementById(`p${i}Faceit`).value;
                payload[`p${i}Rank`] = document.getElementById(`p${i}Rank`).value;
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const responseData = await res.json();

                if (responseData.error) {
                    throw new Error(responseData.error);
                }

                document.getElementById('registrationForm').classList.add('hidden');
                document.getElementById('countdown-wrapper').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');

            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>TRANSMISSION FAILED. RETRY.</span>';
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
